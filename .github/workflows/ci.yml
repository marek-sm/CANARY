name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.11"
      - run: uv sync --locked
      # Every tool process runs in the bubblewrap sandbox (decision 0023). Ubuntu 23.10+
      # restricts unprivileged user namespaces, which bwrap needs.
      - run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv run make sandbox-check
      - run: uv run make test
      - run: uv run make trace
      - run: uv run make t1-smoke
      - run: uv run make t1-suite
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag canary:ci .
      - run: docker run --rm --network none --read-only --tmpfs /app/results/development:uid=10001,gid=10001 --tmpfs /tmp canary:ci
      # Tool-running checks (t1-smoke, t1-suite) run in the test job under the tool
      # sandbox (decision 0023); the container keeps the tool-free mock trace.
