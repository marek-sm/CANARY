name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run make test
      - run: uv run make trace
      - run: uv run make t1-smoke
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag canary:ci .
      - run: docker run --rm --network none --read-only --tmpfs /app/results/development:uid=10001,gid=10001 --tmpfs /tmp canary:ci
      - run: docker run --rm --network none --read-only --tmpfs /app/results/development:uid=10001,gid=10001 --tmpfs /tmp canary:ci python -m runner.ticket_slice
