name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.11"
      - run: uv sync --locked
      # Every tool process runs in the bubblewrap sandbox (decision 0023). Ubuntu 23.10+
      # restricts unprivileged user namespaces, which bwrap needs.
      - run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv run make sandbox-check
      - run: uv run make test
      - run: uv run make trace
      - run: uv run make t1-smoke
      - run: uv run make t1-suite
  # The official sweep's platform (decision 0028 item 8). Not required: it proves GitHub's
  # macOS image, not the project lead's build.
  macos-sandbox:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run make sandbox-check
  # Prototype for decision 0028 item 9, which the project lead hasn't taken. Not required:
  # it proves the sweep image's sandbox on GitHub's arm64 Ubuntu runner, not on Docker
  # Desktop on the lead's Mac (docs/SWEEP_CONTAINER.md). This runner's Docker applies
  # AppArmor, so it needs --apparmor-unconfined and the userns sysctl, which a Mac doesn't.
  sweep-container-arm64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: make sweep-image SWEEP_IMAGE=canary-sweep:ci
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The sandbox tests' controls write the checkout as the image's uid 10001.
      - run: sudo chown -R 10001:10001 "$GITHUB_WORKSPACE"
      - run: sh docker/sweep/launch.sh --image canary-sweep:ci --apparmor-unconfined --writable-checkout -- make sandbox-check
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag canary:ci .
      - run: docker run --rm --network none --read-only --tmpfs /app/results/development:uid=10001,gid=10001 --tmpfs /tmp canary:ci
      # Tool-running checks (t1-smoke, t1-suite) run in the test job under the tool
      # sandbox (decision 0023); the container keeps the tool-free mock trace.
